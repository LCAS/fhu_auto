<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Gate Control</title>
  <meta name="theme-color" content="#1a2b3c">
  <meta name="description" content="Control and monitor the FHU gate from your phone or browser.">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gate Control">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>FHU Gate Control</h1>

  <div class="buttons">
    <button id="btn-up" class="up" data-action="up" data-label="raise">&#8679; Up</button>
    <button id="btn-stop" class="stop" data-action="stop">&#9632; Stop</button>
    <button id="btn-down" class="down" data-action="down" data-label="lower">&#8681; Down</button>
  </div>

  <p id="status" class="status">Ready</p>
  <p id="geofence-status" class="geofence-status">Checking your location…</p>

  <div class="history">
    <h2>Recent commands</h2>
    <ul id="history-list"></ul>
  </div>

  <!-- Confirmation modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Confirm gate movement</h2>
      <p class="warning">
        &#9888; Warning: only operate this gate if you have checked that it is
        safe to do so. Make sure the area around the gate is clear of people
        and obstacles before continuing.
      </p>
      <p id="modal-action-text"></p>
      <div class="modal-buttons">
        <button id="modal-cancel" class="cancel" type="button">Cancel</button>
        <button id="modal-confirm" class="confirm" type="button">
          <span class="confirm-label">Press and hold to confirm (2s)</span>
          <span class="confirm-progress"></span>
        </button>
      </div>
      <button id="modal-stop" class="stop modal-stop" type="button">&#9632; Stop</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
